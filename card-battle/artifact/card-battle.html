<h2>对战规则</h2>
<p class="muted">按标准宝可梦卡牌对战规则整理。本游戏里的「生物」就是规则里的「宝可梦」。</p>

<h3>1. 获胜目标</h3>
<p>满足以下任意一条就获胜：</p>
<ol>
  <li><b>拿完 6 张奖赏卡。</b>每击倒对手 1 只生物，拿 1 张奖赏卡（部分强力卡被击倒时给 2～3 张）。</li>
  <li><b>对手场上没有生物。</b>对手的前场生物被击倒，而且备战区没有生物能换上来。</li>
  <li><b>对手无牌可抽。</b>对手回合开始时牌库是空的，没法抽牌。</li>
</ol>
<p class="muted">双方同时达成胜利条件时，标准规则是"突然死亡"加赛一局（每人只用 1 张奖赏卡）；本游戏直接判平局。</p>

<h3>2. 抽牌规则</h3>
<p><b>开局顺序：</b>掷硬币 → 赢的一方选先攻或后攻 → 洗牌抽 7 张 → 放生物 → 放奖赏卡 → 先攻方开始第一回合。</p>
<ul>
  <li><b>先决定先后手。</b>掷硬币，赢的一方自己选先攻还是后攻。先攻能抢先铺场，但第一回合不能攻击、不能用支援者；后攻第一回合就能攻击。</li>
  <li><b>起始手牌 7 张。</b>双方洗牌后各抽 7 张。</li>
  <li><b>没有基础生物要重抽。</b>手牌里没有基础生物时，亮出手牌、洗回牌库、重抽 7 张。你每重抽 1 次，对手可以多抽 1 张。</li>
  <li><b>奖赏卡 6 张。</b>放好生物后，从牌库顶拿 6 张背面朝上，作为奖赏卡。</li>
  <li><b>每回合开始抽 1 张。</b>先攻方的第一回合也要抽。</li>
  <li>卡牌效果（例如「博士笔记」）可以额外抽牌。效果抽牌时牌库不够，就抽到空为止，<b>不会</b>因此判负；只有回合开始那一抽抽不到才判负。</li>
</ul>

<h3>3. 生物放置规则</h3>
<ul>
  <li><b>场地：</b>前场 1 只（负责战斗），备战区最多 5 只。</li>
  <li><b>准备阶段：</b>从手牌选 1 只基础生物放前场，再放 0～5 只基础生物到备战区。双方都是背面朝上放，放完才同时翻开。这时已经知道先后手，可以据此决定放谁在前场。</li>
  <li><b>自己的回合内：</b>基础生物可以随时放到备战区，次数不限，只要备战区没满。</li>
  <li><b>进化：</b>1 阶卡叠在对应的基础生物上，2 阶卡叠在对应的 1 阶上。进化后保留原来的伤害和能量，并清除特殊状态。
    <ul>
      <li>双方各自的第一回合都不能进化。</li>
      <li>本回合刚放上场、或本回合刚进化过的生物，这回合不能再进化。</li>
      <li>一回合里一只生物只能进化一次。「跃进种子」这类卡例外，可以直接从基础跳到 2 阶。</li>
    </ul>
  </li>
  <li><b>能量：</b>每回合只能从手牌贴 1 张能量，前场、备战区都可以贴。</li>
  <li><b>撤退：</b>每回合 1 次。丢弃等于撤退费用数量的能量（丢哪几个由你自己选），把前场生物和一只备战生物互换。睡眠或麻痹时不能撤退。退到备战区会清除特殊状态。</li>
  <li><b>训练家卡：</b>物品不限次数；支援者每回合 1 张（先攻方第一回合不能用）；竞技场每回合 1 张；宝可梦道具每只生物最多挂 1 个。</li>
</ul>

<h3>4. 进攻规则</h3>
<ul>
  <li><b>只有前场生物能攻击</b>，每回合最多攻击 1 次，攻击后回合立即结束。所以要先放生物、进化、贴能量、用训练家卡，最后再攻击。</li>
  <li><b>先攻方第一回合不能攻击。</b></li>
  <li><b>能量需求：</b>招式左边的圆点是费用。有属性的圆点要贴同属性能量；「无」可以用任何能量支付。能量不会因为攻击消耗掉，除非招式写明要丢弃。</li>
  <li><b>伤害计算顺序：</b>
    <ol>
      <li>招式基础伤害，加上招式自身效果（比如「每多 1 个能量 +20」）</li>
      <li>防守方<b>弱点</b>是攻击方的属性：伤害 ×2</li>
      <li>防守方<b>抗性</b>是攻击方的属性：伤害 −30</li>
    </ol>
    弱点和抗性只对前场生物生效，打到备战区的伤害不算。
  </li>
  <li><b>击倒：</b>剩余 HP 降到 0 就昏厥，连同身上的卡一起进弃牌区，攻击方拿奖赏卡。被击倒的一方从备战区选 1 只换上前场。</li>
  <li><b>特殊状态</b>（只有前场生物会中）：
    <ul>
      <li><b>睡眠：</b>不能攻击、不能撤退。每回合结束时掷硬币，正面醒来。</li>
      <li><b>麻痹：</b>不能攻击、不能撤退。在它自己那方的下个回合结束时解除。</li>
      <li><b>混乱：</b>攻击前掷硬币，反面则攻击失败，自己受到 30 伤害。</li>
      <li><b>中毒：</b>每回合结束时受到 10 伤害。</li>
      <li><b>灼伤：</b>每回合结束时受到 20 伤害，然后掷硬币，正面恢复。</li>
    </ul>
    睡眠、麻痹、混乱互相覆盖，只保留最新的一个；中毒、灼伤可以和它们叠加。进化或退到备战区，会清除所有状态。
  </li>
</ul>

<h3>实卡操作：伤害和状态怎么表示</h3>
<ul>
  <li><b>伤害指示物：</b>卡上印的 HP 不会变。受到伤害就在这只宝可梦身上放伤害指示物，1 个 = 10 伤害（常见面值有 10 / 50 / 100，也有人用骰子）。身上伤害合计 ≥ HP 就昏厥。</li>
  <li>伤害指示物在进化后保留，撤退到备战区也保留；只有回复效果（比如「伤药」）能拿掉。</li>
  <li><b>中毒、灼伤：</b>在宝可梦身上放对应的标记物。</li>
  <li><b>睡眠：</b>卡牌逆时针转 90°。<b>麻痹：</b>顺时针转 90°。<b>混乱：</b>上下颠倒（转 180°）。</li>
  <li>卡片同一时间只能有一个朝向，所以睡眠、麻痹、混乱只保留最新的一个；标记物不占朝向，所以中毒、灼伤可以和它们同时存在。</li>
  <li>本游戏同时显示两种：卡图上放 10 / 50 / 100 的伤害指示物（和实卡一样），右上角直接显示「剩余 HP / 总 HP」方便计算；状态用转卡和标记物表示。</li>
</ul>

<h3>本游戏与标准规则的差异</h3>
<ul class="muted">
  <li>双方同时达成胜利条件时直接判平局，不加赛。</li>
</ul>
