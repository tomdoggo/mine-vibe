<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <meta name="theme-color" content="#050308" />
    <title>深渊老虎机</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <div id="app">
      <div id="stage"></div>

      <!-- 金币 / 转数 / 深渊都显示在 3D 机台上；这里留一份文字给读屏软件 -->
      <div class="sr-only" aria-live="polite">
        金币 <b id="coins">0</b>，剩余 <b id="spins">100</b> 转，深渊 <b id="abyss">1</b> 层
      </div>
      <button class="icon-btn gear" id="btn-settings" aria-label="设置">
        <svg viewBox="0 0 16 16" width="20" height="20" shape-rendering="crispEdges" aria-hidden="true">
          <path fill="currentColor" d="M7 1h2v2h2V2h2v2h-1v2h2v1h1v2h-1v1h-2v2h1v2h-2v-1H9v2H7v-2H5v1H3v-2h1v-2H2V9H1V7h1V6h2V4H3V2h2v1h2z M6 6v4h4V6z"/>
        </svg>
      </button>

      <div class="banner" id="banner"></div>
      <div class="toasts" id="toasts"></div>

      <footer class="panel">
        <div class="bet-row">
          <button class="bet-btn" id="bet-minus" aria-label="减注">−</button>
          <div class="bet-mid">
            <div class="bet-label">下注 <b id="bet">1</b></div>
            <input id="bet-range" type="range" min="1" max="10" step="1" value="1" aria-label="下注金额" />
          </div>
          <button class="bet-btn" id="bet-plus" aria-label="加注">+</button>
          <button class="bet-btn max" id="bet-max">MAX</button>
        </div>
        <button class="spin-btn" id="spin">旋 转</button>
      </footer>

      <div class="modal" id="modal" hidden></div>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
